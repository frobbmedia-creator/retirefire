# Validate the application on pushes and pull requests.
# Production deployment is owned by Vercel's native GitHub integration.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Calculator tests
        run: npm run test:calc

      - name: Content tests
        run: npm run test:content

      - name: Support tests
        run: npm run test:support

      - name: Build application
        run: npx next build
